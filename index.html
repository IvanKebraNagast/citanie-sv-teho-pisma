<!DOCTYPE html>
<html lang="sk">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Čítanie svätého písma</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
            :root {
                --gap-sm: 8px;
                --gap-md: 16px;
                --gap-lg: 24px;
            }

            body {
                font-family: 'Inter', sans-serif;
                background-color: #f3f4f6;
                color: #333;
                line-height: 1.6;
            }

            .container {
                max-width: 900px;
                margin: 2rem auto;
                padding: 2rem;
                background-color: #fff;
                border-radius: 12px;
                box-shadow: 0 4px 6px rgba(0,0,0,.1);
            }

            /* Náhľadové štýly (export má inline) */
            .intro-outro {
                background-color: #fef08a;
                color: #2563eb;
                font-size: 16px;
                padding: 1rem;
                text-align: center;
                border-radius: 8px;
                font-weight: bold;
                margin: 1rem 0;
            }

            .chapter-title {
                text-align: center;
                color: #ef4444;
                font-size: 22px;
                background-color: #bbf7d0;
                padding: 1rem;
                margin: 2rem 0 1rem 0;
                border-radius: 8px;
                font-weight: bold;
            }

            .reader-text {
                color: #ef4444;
                font-weight: bold;
            }

            .reader-block {
                margin: 1rem 0 .75rem 0;
            }

            .verse {
                margin: .5rem 0;
            }
            
            .verse span {
                font-weight: bold;
                margin-right: 0.5rem;
                color: #1f2937;
            }

            hr {
                border-top-width: 2px;
                border-color: #d1d5db;
                margin-top: 1rem;
                margin-bottom: 1rem;
            }

            /* mini badge */
            .pill {
                font-size: 12px;
                line-height: 1;
                padding: .35rem .6rem;
                border-radius: 9999px;
                background: #eef2ff;
                color: #3730a3;
                border: 1px solid #c7d2fe;
                display: inline-block;
            }
        </style>
    </head>
    <body class="p-4">
        <div class="container space-y-6">
            <h1 class="text-3xl font-bold text-center text-gray-800">Čítanie svätého písma</h1>
            <div class="flex flex-col space-y-4">
                <label for="readerNamesInput" class="text-gray-600 font-semibold">Mená čitateľov (oddeľte čiarkou):</label>
                <textarea id="readerNamesInput" rows="2" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300">Aďka, Danka, Emília, Ivan, Janka, Markétka, Milan</textarea>
                <!-- Panel na správu čitateľov -->
                <div class="flex gap-2 items-center">
                    <button id="manageReadersBtn" class="bg-purple-600 text-white font-bold py-2 px-4 rounded-full hover:bg-purple-700 transition shadow-md">Spravovať čitateľov </button>
                    <span class="pill">Mazanie/prechristenie mien nemení verše</span>
                </div>
                <div id="manageReadersPanel" class="hidden p-4 border rounded-lg bg-gray-100 mt-2 space-y-2"></div>
                <!-- /Panel -->
                <label for="introInput" class="text-gray-600 font-semibold">Úvod:</label>
                <textarea id="introInput" rows="3" placeholder="Sem vložte text úvodu..." class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300"></textarea>
                <textarea id="textInput" rows="10" placeholder="Sem vložte text na úpravu (verše a nadpisy kapitol, každý riadok samostatne)..." class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300"></textarea>
                <label for="outroInput" class="text-gray-600 font-semibold">Záver:</label>
                <textarea id="outroInput" rows="3" placeholder="Sem vložte text záveru..." class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300"></textarea>
                <div class="flex flex-wrap gap-2">
                    <button id="previewBtn" class="flex-1 bg-blue-600 text-white font-bold py-3 px-6 rounded-full hover:bg-blue-700 transition shadow-lg">Zobraziť náhľad (pridať verše z poľa) </button>
                    <button id="exportBtn" class="flex-1 bg-green-600 text-white font-bold py-3 px-6 rounded-full hover:bg-green-700 transition shadow-lg">Export do Wordu </button>
                    <button id="clearBtn" class="flex-1 bg-red-600 text-white font-bold py-3 px-6 rounded-full hover:bg-red-700 transition shadow-lg">Vymazať aktuálny text (verše) </button>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button id="saveBtn" class="bg-gray-800 text-white font-bold py-2 px-4 rounded-full hover:bg-black transition shadow">Uložiť do localStorage </button>
                    <button id="loadBtn" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-full hover:bg-indigo-700 transition shadow">Načítať z localStorage </button>
                    <button id="wipeBtn" class="bg-amber-600 text-white font-bold py-2 px-4 rounded-full hover:bg-amber-700 transition shadow">Vymazať uložené dáta (localStorage) </button>
                </div>
            </div>
            <div id="previewOutput" class="p-6 bg-gray-50 border border-gray-200 rounded-lg min-h-[300px] overflow-auto">
                <h2 class="text-xl font-semibold text-center text-gray-700 mb-2">Náhľad dokumentu</h2>
                <!-- sem ide náhľad -->
            </div>
            <div id="verseCountStatus" class="p-4 rounded-lg text-center font-semibold mt-4 hidden"></div>
        </div>
        <!-- Vlastný message box pre upozornenia -->
        <div id="messageBox" class="fixed bottom-4 right-4 bg-gray-800 text-white p-4 rounded-lg shadow-xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none"></div>

        <script>
            // --- DOM prvky ---
            const introInput = document.getElementById('introInput');
            const outroInput = document.getElementById('outroInput');
            const textInput = document.getElementById('textInput');
            const previewBtn = document.getElementById('previewBtn');
            const exportBtn = document.getElementById('exportBtn');
            const clearBtn = document.getElementById('clearBtn');
            const saveBtn = document.getElementById('saveBtn');
            const loadBtn = document.getElementById('loadBtn');
            const wipeBtn = document.getElementById('wipeBtn');
            const previewOutput = document.getElementById('previewOutput');
            const readerNamesInput = document.getElementById('readerNamesInput');
            const verseCountStatus = document.getElementById('verseCountStatus');
            const manageReadersBtn = document.getElementById('manageReadersBtn');
            const manageReadersPanel = document.getElementById('manageReadersPanel');

            // --- Stav ---
            let allVerses = []; // všetky riadky (kapitoly aj verše)
            const LS_KEY = 'ctenie_data_v1'; // kľúč v localStorage (verzia 1)

            // --- Message Box (náhrada za alert/confirm) ---
            const messageBox = document.getElementById('messageBox');
            function showMessage(text) {
                // Jednoduché neblokujúce zobrazenie správy
                messageBox.textContent = text;
                messageBox.classList.remove('opacity-0', 'pointer-events-none');
                messageBox.classList.add('opacity-100');
                setTimeout(() => {
                    messageBox.classList.remove('opacity-100');
                    messageBox.classList.add('opacity-0', 'pointer-events-none');
                }, 3000);
            }

            // ---------- Uloženie / načítanie ----------
            function saveData() {
                const data = {
                    readers: readerNamesInput.value.trim(),
                    intro: introInput.value,
                    outro: outroInput.value,
                    verses: allVerses
                };
                localStorage.setItem(LS_KEY, JSON.stringify(data));
            }

            function loadData() {
                const raw = localStorage.getItem(LS_KEY);
                if (!raw) return false;
                try {
                    const data = JSON.parse(raw);
                    if (typeof data.readers === 'string') readerNamesInput.value = data.readers;
                    if (typeof data.intro === 'string') introInput.value = data.intro;
                    if (typeof data.outro === 'string') outroInput.value = data.outro;
                    if (Array.isArray(data.verses)) allVerses = data.verses.slice();
                    updatePreview(true);
                    return true;
                } catch (e) {
                    console.error('Chyba pri čítaní localStorage:', e);
                    return false;
                }
            }

            function wipeData() {
                localStorage.removeItem(LS_KEY);
            }

            // ---------- Náhľad (VAŠA NOVÁ LOGIKA) ----------
            function updatePreview(skipSave = false) {
                let html = '';
                previewOutput.innerHTML = '';

                const readers = readerNamesInput.value
                    .split(',')
                    .map(s => s.trim())
                    .filter(Boolean);
                if (readers.length === 0) readers.push('Neznámy čitateľ');

                const totalReaders = readers.length;
                
                // --- Dynamické orezávanie (základ 6 ľudí, 324 veršov) ---
                const BASE_READERS = 6;
                const BASE_TOTAL_VERSES = 324;
                const CYCLES = 3;

                // viac ľudí = kratšie čítanie (zachovanie dĺžky čítania)
                let targetTotalVerses = BASE_TOTAL_VERSES;
                const idealVersesPerPerson = BASE_TOTAL_VERSES / BASE_READERS; // 54

                if (totalReaders > BASE_READERS) {
                    // VIAC ľudí (napr. 8): skrátime celkový čas, aby sa ľudia "nenudili"
                    // (6/8) * 324 = 243 (cca 30 veršov na osobu)
                    targetTotalVerses = Math.floor((BASE_READERS / totalReaders) * BASE_TOTAL_VERSES);
                } else if (totalReaders < BASE_READERS) {
                    // MENEJ ľudí (napr. 4): skrátime celkový čas, aby 1 človek nečítal príliš veľa
                    // 4 * 54 = 216 (stále 54 veršov na osobu)
                    targetTotalVerses = Math.floor(totalReaders * idealVersesPerPerson);
                }
                // (Ak sa rovná 6, ostáva 324)


                // --- Verše a bloky ---
                // Používame globálny 'allVerses' (ktorý sa plní z textInput)
                const allVerseLines = allVerses.filter(l => !l.toLowerCase().includes('kapitola'));
                const totalAvailableVerses = allVerseLines.length;
                
                const versesPerPerson = Math.floor(targetTotalVerses / totalReaders);
                // Vypočítame verše na blok, min. 3 verše, aby to nebolo príliš krátke
                const versesPerBlock = Math.max(3, Math.floor(versesPerPerson / CYCLES)); 
                
                // Maximálny počet veršov, ktorý sa skutočne použije (orezané)
                const maxVersesToUse = Math.min(totalAvailableVerses, totalReaders * versesPerBlock * CYCLES);

                const perReaderAssigned = Array(totalReaders).fill(0);
                const perReaderBlockNo = Array(totalReaders).fill(0);
                let verseIndex = 0; // Index v globálnom poli 'allVerses'
                let processedVerseCount = 0; // Počítadlo reálnych veršov (nie kapitol)

                const introText = introInput.value.trim();
                if (introText) html += `<p class="intro-outro export-style">${introText}</p>`;

                // 3 kolá čítania, mená sa striedajú po blokoch
                for (let cycle = 0; cycle < CYCLES; cycle++) {
                    for (let r = 0; r < totalReaders; r++) {
                        
                        // Ak sme už spracovali všetky verše určené na orezanie, končíme
                        if (processedVerseCount >= maxVersesToUse) break;

                        perReaderBlockNo[r]++;
                        const readerName = readers[r];
                        html += `<div class="reader-block">
                            <p class="text-center font-bold mb-3">
                            <span class="reader-text export-style-reader">${perReaderBlockNo[r]}. ${readerName} ♥</span>
                            </p>
                        </div>`;

                        for (let v = 0; v < versesPerBlock; v++) {
                            // Ak sme prešli celý 'allVerses' zoznam
                            if (verseIndex >= allVerses.length) break;
                            
                            // Ak sme už spracovali maximálny počet veršov (orezané)
                            if (processedVerseCount >= maxVersesToUse) break;

                            const line = allVerses[verseIndex];

                            if (!line) break;

                            const isChapter = line.toLowerCase().includes('kapitola');

                            if (isChapter) {
                                // Inteligentná kontrola kapitol:
                                // pridaj kapitolu len ak za ňou je ešte verš (aby neostala visieť)
                                let hasFutureVerse = false;
                                for (let j = verseIndex + 1; j < allVerses.length && j - verseIndex < 10; j++) {
                                    if (!allVerses[j].toLowerCase().includes('kapitola')) {
                                        hasFutureVerse = true;
                                        break;
                                    }
                                }
                                
                                // A zároveň, ten budúci verš musí byť v rámci orezaného limitu
                                if (hasFutureVerse && processedVerseCount < maxVersesToUse) {
                                    html += '<hr class="border-t-2 border-gray-300 my-4">';
                                    html += `<p class="chapter-title export-style-chapter">${line}</p>`;
                                    html += '<hr class="border-t-2 border-gray-300 my-4">';
                                }
                                verseIndex++;
                                v--; // nezapočítavaj kapitolu ako verš do bloku
                                continue;
                            }

                            // Priradenie verša
                            // Nájdenie správneho indexu verša (bez kapitol) pre číslovanie
                            const verseLineIndex = allVerseLines.findIndex(l => l === line);
                            
                            if (verseLineIndex !== -1) {
                                html += `<p class="verse"><span>${verseLineIndex + 1}.</span> ${line}</p>`;
                                perReaderAssigned[r]++;
                                processedVerseCount++; // Zvýšime počet spracovaných veršov
                            }
                            
                            verseIndex++;
                        }
                    }
                }
                
                const finalVerseCount = processedVerseCount;

                const outroText = outroInput.value.trim();
                if (outroText) html += `<p class="intro-outro export-style mt-6">${outroText}</p>`;
                previewOutput.innerHTML = html;

                // stav
                verseCountStatus.className = 'p-4 rounded-lg text-center font-semibold mt-4';
                verseCountStatus.classList.remove('hidden');
                
                let detail = readers.map(
                    (n, i) => `<p class="ml-4">• ${n}: <strong>${perReaderAssigned[i]}</strong> veršov (${perReaderBlockNo[i]}x${versesPerBlock})</p>`
                ).join('');
                    
                let statusText = '';
                if (totalAvailableVerses > finalVerseCount) {
                     statusText = `<div class="text-yellow-800 bg-yellow-200 rounded-lg p-3">
                        ⚠️ ${totalReaders} čitateľov. Text bol automaticky orezaný na ${finalVerseCount} veršov (z ${totalAvailableVerses}).
                     </div>`;
                } else {
                     statusText = `<div class="text-green-800 bg-green-200 rounded-lg p-3">
                        ✅ ${totalReaders} čitateľov, ${CYCLES} kolá, spolu ${finalVerseCount} veršov (zo ${totalAvailableVerses}).
                     </div>`;
                }
                
                verseCountStatus.innerHTML = `
                    ${statusText}
                    <hr class="my-2 border-gray-400">
                    <div class="font-bold">Rozdelenie:</div>
                    ${detail}
                `;

                if (!skipSave) autoSaveDebounced();
            }


            // ---------- Spracovanie vstupu veršov (pridanie) ----------
            function handlePreviewAddVerses() {
                const inputText = textInput.value.trim();
                if (inputText) {
                    const lines = inputText.split('\n').map(l => l.trim()).filter(Boolean);
                    allVerses = allVerses.concat(lines);
                    textInput.value = '';
                }
                updatePreview();
            }

            // ---------- Čistenie aktuálneho textu (nie storage) ----------
            function handleClearText() {
                allVerses = [];
                updatePreview();
                previewOutput.innerHTML = '<h2 class="text-xl font-semibold text-center text-gray-700 mb-2">Náhľad dokumentu</h2>';
                verseCountStatus.classList.add('hidden');
                autoSaveDebounced();
            }

            // ---------- Export do Wordu ----------
            function exportToWord() {
                const content = previewOutput.innerHTML;
                if (!content || content.includes('Náhľad documentu')) {
                    showMessage('Náhľad je prázdny. Najprv vložte a upravte text.');
                    return;
                }

                const temp = document.createElement('div');
                temp.innerHTML = content;

                // Inline štýly pre stabilný export
                temp.querySelectorAll('.export-style').forEach(el => {
                    el.setAttribute('style', 'background-color:#fef08a;color:#2563eb;font-size:16px;padding:1rem;text-align:center;font-weight:bold;margin:1rem 0;border:1px solid #fef08a;');
                });
                temp.querySelectorAll('.export-style-chapter').forEach(el => {
                    el.setAttribute('style', 'text-align:center;color:#ef4444;font-size:22px;background-color:#bbf7d0;padding:1rem;font-weight:bold;margin:2rem 0 1rem 0;border:1px solid #bbf7d0;');
                });
                temp.querySelectorAll('.export-style-reader').forEach(el => {
                    el.setAttribute('style', 'color:#ef4444;font-weight:bold;');
                });
                
                // Oprava pre .verse span
                 temp.querySelectorAll('.verse span').forEach(el => {
                    el.setAttribute('style', 'font-weight:bold;margin-right:0.5rem;color:#1f2937;');
                });

                const htmlToExport = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                        <head>
                            <meta charset='utf-8'>
                            <title>Dokument</title>
                            <style>
                                body{font-family:Inter,Arial,sans-serif;line-height:1.6;margin:2rem;color:#333;}
                                .verse{margin:.5rem 0;}
                                hr{border-top-width:2px;border-color:#d1d5db;margin:1rem 0;}
                            </style>
                        </head>
                        <body>
                            ${temp.innerHTML}
                        </body>
                </html>`;

                const blob = new Blob([htmlToExport], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'upraveny_text.doc';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // ---------- Panel čitateľov (rename/delete/add) ----------
            function renderReadersManager() {
                const readers = readerNamesInput.value.split(',').map(v => v.trim()).filter(Boolean);

                if (readers.length === 0) {
                    manageReadersPanel.innerHTML = `<p class="text-sm text-red-500">Zadajte aspoň jedného čitateľa.</p>
                            <button id="addReaderBtn" class="w-full bg-green-600 text-white font-bold py-1 px-3 rounded-full mt-2 hover:bg-green-700">➕ Pridať čitateľa</button>`;
                    return;
                }

                manageReadersPanel.innerHTML = readers.map((name, i) => `<div class="flex justify-between items-center bg-white p-2 rounded shadow">
                        <span class="truncate pr-2">${i+1}. ${name}</span>
                        <div class="flex gap-2">
                            <button class="renameReaderBtn bg-blue-500 text-white px-2 py-1 rounded text-sm hover:bg-blue-600" data-index="${i}">✏️</button>
                            <button class="deleteReaderBtn bg-red-500 text-white px-2 py-1 rounded text-sm hover:bg-red-600" data-index="${i}">❌</button>
                        </div>
                </div>`).join('') + `<button id="addReaderBtn" class="w-full bg-green-600 text-white font-bold py-1 px-3 rounded-full mt-2 hover:bg-green-700">➕ Pridať čitateľa</button>`;
            }

            manageReadersBtn.addEventListener('click', () => {
                manageReadersPanel.classList.toggle('hidden');
                if (!manageReadersPanel.classList.contains('hidden')) renderReadersManager();
            });

            document.addEventListener('click', (e) => {
                if (e.target.id === 'addReaderBtn') {
                    const readers = readerNamesInput.value.split(',').map(v => v.trim()).filter(Boolean);
                    const nm = prompt('Meno nového čitateľa:');
                    if (nm && nm.trim()) {
                        readers.push(nm.trim());
                        readerNamesInput.value = readers.join(', ');
                        renderReadersManager();
                        updatePreview();
                    }
                }

                if (e.target.classList.contains('renameReaderBtn')) {
                    const idx = Number(e.target.dataset.index);
                    const readers = readerNamesInput.value.split(',').map(v => v.trim()).filter(Boolean);
                    const nm = prompt('Nové meno:', readers[idx]);
                    if (nm && nm.trim()) {
                        readers[idx] = nm.trim();
                        readerNamesInput.value = readers.join(', ');
                        renderReadersManager();
                        updatePreview();
                    }
                }

                if (e.target.classList.contains('deleteReaderBtn')) {
                    const idx = Number(e.target.dataset.index);
                    const readers = readerNamesInput.value.split(',').map(v => v.trim()).filter(Boolean);
                    
                    if (readers.length <= 1) return showMessage('Musí zostať aspoň 1 čitateľ.');

                    readers.splice(idx, 1);
                    readerNamesInput.value = readers.join(', ');
                    renderReadersManager();
                    updatePreview();
                }
            });

            // ---------- AutoSave (debounce) ----------
            let autosaveTimer = null;
            function autoSaveDebounced() {
                if (autosaveTimer) clearTimeout(autosaveTimer);
                autosaveTimer = setTimeout(saveData, 300);
            }

            // ---------- Listenery ----------
            previewBtn.addEventListener('click', handlePreviewAddVerses);
            exportBtn.addEventListener('click', exportToWord);
            clearBtn.addEventListener('click', handleClearText);

            saveBtn.addEventListener('click', () => {
                saveData();
                showMessage('Dáta úspešne uložené.');
            });

            loadBtn.addEventListener('click', () => {
                const ok = loadData();
                if (!ok) showMessage('Nenašli sa uložené dáta.');
                else showMessage('Uložené dáta načítané.');
            });

            wipeBtn.addEventListener('click', () => {
                wipeData();
                showMessage('Uložené dáta odstránené.');
            });

            // ---------- Po načítaní stránky ----------
            // Skús načítať z localStorage; ak nie je, aspoň prázdny náhľad.
            loadData() || updatePreview(true);
        </script>
    </body>
</html>
